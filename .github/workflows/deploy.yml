  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write   # <-- PERMISSÃO OBRIGATÓRIA para fazer o push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./artifact

      - name: Deploy para branch 'deploy'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: deploy          # <-- Nome da branch que vai receber os arquivos
          folder: ./artifact      # Pasta onde está o build
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: true             # Remove arquivos antigos antes de copiar
