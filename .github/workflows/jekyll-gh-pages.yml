name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      upload_path: ${{ steps.set-path.outputs.upload_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies (if package.json exists)
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          fi

      - name: Build project (if build script exists)
        run: |
          if [ -f package.json ] && grep -q '"build"' package.json; then
            npm run build
          fi

      - name: Determine upload path
        id: set-path
        run: |
          if [ -d "dist" ]; then
            echo "upload_path=dist" >> $GITHUB_OUTPUT
          elif [ -d "build" ]; then
            echo "upload_path=build" >> $GITHUB_OUTPUT
          else
            echo "upload_path=." >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.set-path.outputs.upload_path }}

  deploy:
  runs-on: ubuntu-latest
  needs: build
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: github-pages
        path: ./artifact

    - name: Deploy to gh-pages branch
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./artifact
        publish_branch: gh-pages   # você pode mudar para 'main' se preferir
        force_orphan: true         # (opcional) limpa o histórico da branch
          NODE_OPTIONS: '--no-deprecation'
